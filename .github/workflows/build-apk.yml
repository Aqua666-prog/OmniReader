name: Build OmniReader APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap official Gradle Wrapper JAR
        shell: bash
        run: ./bootstrap-wrapper.sh

      - name: Verify Android 17 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager not found at $SDKMANAGER" >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            if ! "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"; then
              "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
            fi
          fi

      - name: Set up Gradle from wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OmniReader-0.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
