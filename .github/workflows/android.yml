name: Build OmniReader APK

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: |
          # API 37 is published by sdkmanager as android-37.0 (not android-37).
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/zipalign"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch pinned native backend and OCR models
        run: gradle prepareDjvuAar prepareOcrModels --stacktrace

      - name: Source and migration checks
        run: |
          python3 tools/verify-source.py
          python3 tools/test-document-migration.py

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Audit packaged native libraries
        run: |
          python3 tools/audit-native-apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniReader-0.8.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniReader-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
