org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.x enables built-in Kotlin/new DSL by default. This project still uses
# the external Kotlin Android plugin and KSP for Room, so opt out here to keep
# the build configuration consistent with the current AGP/Kotlin toolchain.
android.builtInKotlin=false
android.newDsl=false
