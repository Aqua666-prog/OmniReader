org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.x enables built-in Kotlin/new DSL by default. This project still uses
# the Kotlin Android + kapt plugins for Room, so opt out until the build is
# migrated to built-in Kotlin + KSP/legacy-kapt.
android.builtInKotlin=false
android.newDsl=false
